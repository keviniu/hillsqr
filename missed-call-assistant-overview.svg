<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6ff"/><stop offset="1" stop-color="#eaf7ef"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a5b4fc" stop-opacity=".55"/><stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity=".14"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <g id="person"><circle cx="0" cy="0" r="27"/><path d="M-48 104 C-48 46 -28 32 0 32 C28 32 48 46 48 104 Z"/></g>
    <g id="phone"><rect x="-36" y="-64" width="72" height="128" rx="15" fill="#111827"/><rect x="-30" y="-54" width="60" height="104" rx="9" fill="#eff6ff"/><rect x="-10" y="55" width="20" height="4" rx="2" fill="#475569"/></g>
    <path id="handset" d="M-14 -20 C-20 -20 -22 -10 -18 0 C-12 14 0 22 12 26 C20 28 24 22 22 16 L16 10 C14 8 10 9 8 11 C4 10 -2 5 -4 0 C-3 -3 -1 -4 -1 -6 L-8 -18 C-9 -20 -12 -20 -14 -20 Z"/>
    <path id="spark" d="M0 -16 C2 -4 4 -2 16 0 C4 2 2 4 0 16 C-2 4 -4 2 -16 0 C-4 -2 -2 -4 0 -16 Z"/>
  </defs>

  <rect width="1800" height="900" fill="url(#bg)"/>
  <text x="900" y="72" text-anchor="middle" font-size="42" font-weight="800" fill="#1e293b">When you are busy, nothing gets missed</text>
  <text x="900" y="108" text-anchor="middle" font-size="21" fill="#64748b">Every call and WhatsApp message is answered from your own company knowledge, then summarised and sent to you</text>

  <!-- customer 1: calls -->
  <g transform="translate(130,250)">
    <use href="#person" fill="#2563eb"/>
    <g transform="translate(150,10) rotate(-10)"><use href="#phone"/><circle cx="0" cy="-4" r="26" fill="#22c55e"/><use href="#handset" fill="#fff" transform="translate(0,-4) scale(.8)"/></g>
    <g fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"><path d="M200 -66 q22 14 4 40"/><path d="M216 -80 q34 24 6 68"/></g>
    <text x="80" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Customer calls</text>
    <text x="80" y="195" text-anchor="middle" font-size="18" fill="#64748b">asks a question while you are busy</text>
  </g>

  <!-- customer 2: types -->
  <g transform="translate(130,640)">
    <use href="#person" fill="#f59e0b"/>
    <g transform="translate(150,10) rotate(-6)"><use href="#phone"/>
      <rect x="-24" y="-42" width="40" height="18" rx="9" fill="#cbd5e1"/>
      <rect x="-14" y="-16" width="40" height="18" rx="9" fill="#bbf7d0"/>
      <rect x="-26" y="12" width="46" height="26" rx="13" fill="#e2e8f0"/>
      <circle cx="-12" cy="25" r="4.5" fill="#64748b"/><circle cx="-1" cy="25" r="4.5" fill="#64748b"/><circle cx="10" cy="25" r="4.5" fill="#64748b"/>
    </g>
    <text x="80" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Customer types a message</text>
    <text x="80" y="195" text-anchor="middle" font-size="18" fill="#64748b">with a question</text>
  </g>

  <!-- arrows in -->
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)" opacity=".85">
    <path d="M370 300 C520 300, 520 425, 634 440"/>
    <path d="M370 690 C520 690, 520 490, 634 472"/>
  </g>


  <!-- knowledge base -->
  <g transform="translate(600,150)" filter="url(#sh)">
    <rect width="320" height="128" rx="24" fill="#fff"/>
    <g transform="translate(160,48)">
      <path d="M0 -26 C-18 -34 -40 -34 -58 -28 L-58 22 C-40 16 -18 16 0 24 Z" fill="#fef3c7" stroke="#d97706" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0 -26 C18 -34 40 -34 58 -28 L58 22 C40 16 18 16 0 24 Z" fill="#fff7ed" stroke="#d97706" stroke-width="4" stroke-linejoin="round"/>
      <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><path d="M-44 -14 L-14 -10"/><path d="M-44 -2 L-14 2"/><path d="M14 -10 L44 -14"/><path d="M14 2 L44 -2"/></g>
    </g>
    <text x="160" y="98" text-anchor="middle" font-size="19" font-weight="800" fill="#1e293b">Your company knowledge base</text>
    <text x="160" y="118" text-anchor="middle" font-size="15" fill="#64748b">services, hours, prices, FAQs, policies</text>
  </g>
  <path d="M760 282 L760 332" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <text x="776" y="312" font-size="15" font-weight="700" fill="#b45309">answers from it</text>

  <!-- assistant -->
  <g transform="translate(760,455)">
    <circle r="190" fill="url(#glow)"/>
    <circle r="122" fill="#e0e7ff"/>
    <circle r="100" fill="url(#ai)" filter="url(#sh)"/>
    <rect x="-52" y="-44" width="104" height="84" rx="26" fill="#fff"/>
    <circle cx="-20" cy="-8" r="9" fill="#4f46e5"/><circle cx="20" cy="-8" r="9" fill="#4f46e5"/>
    <path d="M-18 14 Q0 30 18 14" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
    <path d="M-62 -6 C-62 -70 62 -70 62 -6" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <rect x="-72" y="-20" width="20" height="36" rx="9" fill="#fff"/><rect x="52" y="-20" width="20" height="36" rx="9" fill="#fff"/>
    <path d="M-62 14 C-62 52 -34 62 -12 58" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="-8" cy="58" r="7" fill="#fff"/>
    <use href="#spark" fill="#fde68a" transform="translate(96,-96) scale(1.2)"/><use href="#spark" fill="#fff" transform="translate(-104,-84) scale(.8)"/><use href="#spark" fill="#c7d2fe" transform="translate(108,84) scale(.7)"/>
    <text y="178" text-anchor="middle" font-size="30" font-weight="800" fill="#1e293b">Your virtual assistant</text>
    <text y="212" text-anchor="middle" font-size="19" fill="#64748b">answers questions from your knowledge,</text><text y="238" text-anchor="middle" font-size="19" fill="#64748b">takes the message and flags what is urgent</text>
  </g>

  <!-- arrows out to channels -->
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)" opacity=".85">
    <path d="M884 425 C965 425, 965 225, 1024 225"/>
    <path d="M888 455 L1024 455"/>
    <path d="M884 485 C990 485, 965 685, 1022 685"/>
  </g>

  <!-- email card -->
  <g transform="translate(1030,150)" filter="url(#sh)">
    <rect width="210" height="150" rx="24" fill="#fff"/>
    <rect x="55" y="26" width="100" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <path d="M58 32 L105 66 L152 32" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="150" cy="30" r="14" fill="#ef4444"/><text x="150" y="36" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text>
    <text x="105" y="116" text-anchor="middle" font-size="23" font-weight="800" fill="#1e293b">Email</text>
    <text x="105" y="138" text-anchor="middle" font-size="16" fill="#64748b">full record + transcript</text>
  </g>

  <!-- whatsapp card (generic chat bubble, not the brand logo) -->
  <g transform="translate(1030,380)" filter="url(#sh)">
    <rect width="210" height="150" rx="24" fill="#fff"/>
    <rect x="62" y="20" width="86" height="64" rx="22" fill="#25d366"/><path d="M80 78 L72 98 L100 82 Z" fill="#25d366"/>
    <rect x="80" y="38" width="50" height="7" rx="3.5" fill="#fff"/><rect x="80" y="54" width="34" height="7" rx="3.5" fill="#fff"/>
    <text x="105" y="116" text-anchor="middle" font-size="23" font-weight="800" fill="#1e293b">WhatsApp</text>
    <text x="105" y="138" text-anchor="middle" font-size="16" fill="#64748b">quick alert, tap to reply</text>
  </g>

  <!-- sms card -->
  <g transform="translate(1030,610)" filter="url(#sh)">
    <rect width="210" height="150" rx="24" fill="#fff"/>
    <rect x="60" y="22" width="90" height="62" rx="22" fill="#3b82f6"/><path d="M78 80 L72 98 L96 82 Z" fill="#3b82f6"/>
    <text x="105" y="63" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">SMS</text>
    <text x="105" y="116" text-anchor="middle" font-size="23" font-weight="800" fill="#1e293b">Text message</text>
    <text x="105" y="138" text-anchor="middle" font-size="16" fill="#64748b">short summary</text>
  </g>

  <!-- arrows to owner -->
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)" opacity=".85">
    <path d="M1244 225 C1360 225, 1380 430, 1460 440"/>
    <path d="M1244 455 L1460 455"/>
    <path d="M1244 685 C1360 685, 1380 480, 1460 470"/>
  </g>

  <!-- owner -->
  <g transform="translate(1610,400)">
    <circle cy="40" r="150" fill="#bbf7d0" opacity=".45"/>
    <use href="#person" fill="#0f766e"/>
    <g transform="translate(70,70) rotate(12)"><use href="#phone"/><circle cx="0" cy="-6" r="24" fill="#22c55e"/><path d="M-11 -6 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text y="178" text-anchor="middle" font-size="30" font-weight="800" fill="#1e293b">You</text>
    <text y="210" text-anchor="middle" font-size="19" fill="#64748b">know who, why and how urgent</text>
  </g>

  <text x="900" y="868" text-anchor="middle" font-size="18" fill="#94a3b8">You choose which alerts to receive. If one fails, the others still arrive.</text>
</svg>
