<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David's Property | Roofer &amp; Handyman in Arborfield, Berkshire</title>
<meta name="description" content="Local roofer and handyman in Arborfield. Roof repairs, fencing, TV walls and property maintenance. 100% recommended on Facebook. Free no-obligation quotes.">
<link rel="canonical" href="https://hillsqr.com/client/handymandavid/">
<meta name="robots" content="noindex, nofollow"><!-- TEST copy: remove noindex when it goes live on David's own domain -->
<meta property="og:title" content="David's Property | Roofer &amp; Handyman in Arborfield">
<meta property="og:description" content="Roof repairs, fencing, TV walls and property maintenance. Free no-obligation quotes.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">


<style>
:root{
  --ink:#1F2124; --ink-2:#2A2D32; --ink-3:#3A3D42;
  --paper:#F6F5F2; --white:#FFFFFF; --line:#E4E2DC; --line-2:#C9C6BE;
  --muted:#4A4E55; --muted-2:#5A5E66; --on-dark:#C9C7C1;
  --accent:#F5B800;
  --display:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--ink)}
a:hover{color:#000}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:88px 0}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1}
h2{font-size:clamp(38px,5vw,52px);font-weight:800}
.head-row{display:flex;flex-wrap:wrap;gap:16px 48px;justify-content:space-between;align-items:flex-end;margin-bottom:40px}
.head-row > div{display:flex;flex-direction:column;gap:12px;max-width:640px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;background:var(--accent);padding:8px 12px;z-index:10}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:14px 26px;border-radius:6px;font-weight:700;font-size:17px;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-accent{background:var(--accent);color:var(--ink)}
.btn-accent:hover{filter:brightness(1.05);color:var(--ink)}
.btn-dark{background:var(--ink);color:var(--white);font-size:15px;padding:10px 18px}
.btn-dark:hover{color:var(--white);background:#000}
.btn-outline{border-color:var(--white);color:var(--white)}
.btn-outline:hover{background:var(--white);color:var(--ink)}
.icon{width:20px;height:20px;flex:none}

/* Top strip + header */
.strip{background:var(--ink);color:#E8E6E1;font-size:14px}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px}
.strip a{color:#E8E6E1;text-decoration:none;font-weight:600;margin-left:20px}
.strip a:first-child{margin-left:0}
header.site{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.site .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-name{display:block;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand-sub{display:block;font-size:12px;color:var(--muted-2);margin-top:4px}
nav.main{display:flex;flex-wrap:wrap;gap:8px 28px;font-weight:500;font-size:15px}
nav.main a{text-decoration:none}
nav.main a:hover{text-decoration:underline}

/* Hero */
.hero{background:var(--ink);color:var(--white)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding-top:72px;padding-bottom:80px}
.hero-copy{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:24px}
.badge{align-self:flex-start;background:var(--accent);color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px}
.hero h1{font-size:clamp(48px,7vw,72px);font-weight:800;line-height:.95}
.hero p{margin:0;font-size:19px;color:var(--on-dark);max-width:540px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:28px;padding-top:16px;border-top:1px solid var(--ink-3)}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:800;color:var(--accent);line-height:1.1}
.stat span{font-size:14px;color:var(--on-dark)}
.hero-media{flex:1 1 420px;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hero-media .ph{height:170px}
.hero-media .ph.big{grid-column:span 2;height:280px}

/* Photo placeholders (swap for <img> tags) */
.ph{border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph-dark{background:#2C2F34;border:2px dashed #4A4E55;color:#9A9DA3}
.ph-light{background:#E9E7E2;border:2px dashed var(--line-2);color:#6B6F76}

/* Services */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:14px}
.card-icon{width:52px;height:52px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.card-icon svg{width:26px;height:26px;stroke:var(--accent)}
.card h3{font-size:28px;font-weight:700;letter-spacing:.02em}
.card p{margin:0;color:var(--muted)}

/* Work */
.work{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filters,.head-row > .filters{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.filters button{min-height:44px;padding:10px 18px;border-radius:999px;font:600 14px var(--body);cursor:pointer;background:var(--white);color:var(--ink);border:1px solid var(--line-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.jobs{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.job{margin:0;display:flex;flex-direction:column;gap:12px}
.job[hidden]{display:none}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;border-radius:10px;overflow:hidden}
.ba .ph{position:relative;height:220px;border-radius:0;border:0}
.ba .ph:last-child{background:#DEDBD4}
.tag{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--white)}
.tag.after{background:var(--accent);color:var(--ink)}
.job figcaption{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.job figcaption span{color:var(--muted-2)}

/* Steps */
.steps{margin:0;padding:0;list-style:none;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.steps li{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:4px solid var(--ink)}
.steps li:last-child{border-top-color:var(--accent)}
.steps .num{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.steps h3{font-family:var(--body);text-transform:none;font-size:20px;line-height:1.3}
.steps p{margin:0;color:var(--muted)}

/* Reviews */
.reviews{background:var(--ink);color:var(--white)}
.reviews .eyebrow{color:var(--on-dark)}
.reviews h2 span{color:var(--accent)}
.reviews .head-row a{color:var(--white);font-weight:600}
.review{margin:0;background:var(--ink-2);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:18px}
.review p{margin:0;font-size:17px;line-height:1.6;color:#E8E6E1}
.review footer{font-size:14px;color:var(--on-dark)}
.review strong{color:var(--white)}

/* Areas */
.areas .wrap{display:block}
.areas .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.areas-copy{flex:1 1 100%;max-width:960px;min-width:0;display:flex;flex-direction:column;gap:16px}
.areas-copy p{margin:0;font-size:17px;color:var(--muted)}
.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--white);border:1px solid #D6D3CC;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500}

/* Quote */
.quote{background:var(--accent)}
.quote .wrap{display:flex;flex-wrap:wrap;gap:48px}
.quote-copy{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px}
.quote-copy h2{font-size:clamp(44px,6vw,60px);line-height:.95}
.quote-copy p{margin:0;font-size:18px}
.contact-list{display:flex;flex-direction:column;gap:14px;font-size:17px}
.contact-list a{font-weight:700;text-decoration:none;display:flex;gap:10px;align-items:center}
.form-card{flex:2 1 520px;min-width:0;background:var(--white);border-radius:12px;padding:36px}
form.quote-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field.full{grid-column:span 2}
.field input,.field select,.field textarea{font:400 16px var(--body);color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;min-height:44px;background:var(--white)}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.form-actions{grid-column:span 2;display:flex;flex-wrap:wrap;gap:12px}
.form-actions .btn{flex:1 1 220px}
.btn-submit{background:var(--ink);color:var(--white);font-size:17px}
.btn-submit:hover{background:#000}
.btn-wa{background:var(--white);color:var(--ink);border-color:var(--ink);font-size:17px}
.hp{position:absolute;left:-9999px}
.form-msg{grid-column:span 2;margin:0;font-size:14px;color:var(--muted)}
.thanks{display:flex;flex-direction:column;gap:12px;padding:40px 0;text-align:center;align-items:center}
.thanks h3{font-size:36px}
.thanks p{margin:0;color:var(--muted)}

/* Footer */
footer.site{background:var(--ink);color:var(--on-dark);font-size:14px}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;padding-top:40px;padding-bottom:40px}
footer.site a{color:var(--on-dark);margin-left:20px}
footer.site strong{color:var(--white)}

/* Mobile call bar */
.callbar{display:none}

@media (max-width:720px){
  .section{padding:64px 0}
  .strip{display:none}
  nav.main{display:none}
  header.site .btn-dark{padding:10px 14px}
  .hero .wrap{padding-top:48px;padding-bottom:56px}
  .hero-media .ph.big{height:220px}
  .jobs{grid-template-columns:1fr}
  .ba .ph{height:160px}
  form.quote-form{grid-template-columns:1fr}
  .field.full,.form-actions,.form-msg,.wa-steps{grid-column:auto}
  .form-card{padding:24px}
  .callbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:6;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
  .callbar a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;font-weight:700;text-decoration:none}
  .callbar a:first-child{background:var(--ink);color:var(--white)}
  .callbar a:last-child{background:var(--accent);color:var(--ink)}
  body{padding-bottom:56px}
}
.filters:empty,.grid:empty{display:none}
[hidden]{display:none !important}
.ph:has(img){border:0;padding:0}
</style>
</head>
<body>
<!-- Layout only. All content comes from site-data.js — edit that file, not this one. -->
<a class="skip" href="#main">Skip to content</a>

<div class="strip">
  <div class="wrap">
    <span data-text="business.strapline"></span>
    <span id="strip-phones"></span>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <a class="brand" href="#top">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <rect width="44" height="44" rx="6" fill="#1F2124"/>
        <path d="M8 22 L22 10 L36 22" fill="none" stroke="#8C9096" stroke-width="4" stroke-linejoin="round"/>
        <path d="M13 26 L22 18 L31 26" fill="none" stroke="#5E6268" stroke-width="4" stroke-linejoin="round"/>
        <path d="M30 18 V34 H20" fill="none" stroke="#F5B800" stroke-width="4"/>
      </svg>
      <span>
        <span class="brand-name" data-text="business.name"></span>
        <span class="brand-sub" data-text="business.subName"></span>
      </span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#services">Services</a>
      <a href="#work">Our work</a>
      <a href="#reviews">Reviews</a>
      <a href="#areas">Areas</a>
      <a href="#quote">Contact</a>
    </nav>
    <a class="btn btn-dark" data-wa href="#">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>
      WhatsApp David
    </a>
  </div>
</header>

<main id="main">

<section class="hero" id="top">
  <div class="wrap">
    <div class="hero-copy">
      <span class="badge" data-text="hero.badge"></span>
      <h1 data-text="hero.heading"></h1>
      <p data-text="hero.intro"></p>
      <div class="ctas">
        <a class="btn btn-accent" href="#quote">Get a free quote</a>
        <a class="btn btn-outline" id="hero-call" href="#"></a>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="hero-media" id="hero-photos"></div>
  </div>
</section>

<section class="section" id="services">
  <div class="wrap">
    <div class="head-row">
      <div>
        <span class="eyebrow" data-text="services.eyebrow"></span>
        <h2 data-text="services.heading"></h2>
      </div>
      <a href="#quote" style="font-weight:600">Not listed? Just ask →</a>
    </div>
    <div class="grid" id="services-list"></div>
  </div>
</section>

<section class="section work" id="work">
  <div class="wrap">
    <div class="head-row">
      <div>
        <span class="eyebrow" data-text="jobs.eyebrow"></span>
        <h2 data-text="jobs.heading"></h2>
      </div>
      <div class="filters" id="job-filters" role="group" aria-label="Filter jobs"></div>
    </div>
    <div class="jobs" id="job-list"></div>
  </div>
</section>

<section class="section" id="how">
  <div class="wrap">
    <h2 style="margin-bottom:40px">How it works</h2>
    <ol class="steps" id="steps"></ol>
  </div>
</section>

<section class="section reviews" id="reviews">
  <div class="wrap">
    <div class="head-row">
      <div>
        <span class="eyebrow" data-text="reviews.eyebrow"></span>
        <h2><span data-text="reviews.headline" style="color:inherit"></span> <span id="review-count"></span></h2>
      </div>
      <a id="fb-reviews" href="#">Read them all on Facebook →</a>
    </div>
    <div class="grid" id="review-list"></div>
  </div>
</section>

<section class="section areas" id="areas">
  <div class="wrap">
    <div class="areas-copy">
      <span class="eyebrow">Areas covered</span>
      <h2 data-text="areas.heading"></h2>
      <p data-text="areas.text"></p>
      <ul class="chips" id="towns"></ul>
    </div>
  </div>
</section>

<section class="section quote" id="quote">
  <div class="wrap">
    <div class="quote-copy">
      <h2 data-text="quote.heading"></h2>
      <p data-text="quote.text"></p>
      <div class="contact-list" id="contact-list"></div>
    </div>

    <div class="form-card">
      <div class="thanks" id="thanks" role="status" hidden>
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1F2124" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg>
        <h3>Thanks — request sent</h3>
        <p>We'll be in touch shortly.</p>
      </div>
      <form class="quote-form" id="quote-form" method="POST">
        <input type="hidden" name="_subject" id="form-subject">
        <label class="hp" aria-hidden="true">Leave blank <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
        <label class="field">Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="field">Phone
          <input type="tel" name="phone" autocomplete="tel" required>
        </label>
        <label class="field">Postcode
          <input type="text" name="postcode" autocomplete="postal-code">
        </label>
        <label class="field">Type of job
          <select name="job_type" id="job-types"></select>
        </label>
        <label class="field full">What needs doing?
          <textarea name="message" rows="4"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-submit">Request my free quote</button>
          <button type="button" class="btn btn-wa" id="send-wa">Send via WhatsApp instead</button>
        </div>
        <p class="form-msg" id="form-msg" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>

</main>

<footer class="site">
  <div class="wrap">
    <span><strong data-text="business.name"></strong> · <span data-text="business.subName"></span> · <span id="footer-place"></span> · © <span id="year"></span></span>
    <span><a id="fb-footer" href="#">Facebook</a><a href="#quote">Free quote</a></span>
  </div>
</footer>

<nav class="callbar" aria-label="Quick contact">
  <a id="callbar-call" href="#">Call</a>
  <a href="#quote">Free quote</a>
</nav>

  var B = S.business;

  /* ---- helpers ---- */
  function get(path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, S); }

    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];

      else n.setAttribute(k, attrs[k]);

  function photo(src, alt, cls) {
    return src
      ? el('div', { 'class': cls }, [el('img', { src: src, alt: alt || '', loading: 'lazy' })])

  }
  var ICON = {

    tv:    'M3 5h18v11H3zM8 20h8M12 16v4',
    tools: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z',
    check: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
    house: 'M3 21h18M5 21V9l7-5 7 5v12M9 21v-8h6v8'
  };
  var PHONE_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
  var WA_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>';
  var QUOTE_SVG = '<svg width="32" height="24" viewBox="0 0 32 24" aria-hidden="true"><path d="M0 24V14C0 6 4 1 12 0v5c-4 1-6 4-6 8h6v11zm18 0V14c0-8 4-13 12-14v5c-4 1-6 4-6 8h6v11z" fill="#F5B800"/></svg>';

  /* ---- simple text ---- */
  document.querySelectorAll('[data-text]').forEach(function (n) { n.textContent = get(n.dataset.text) || ''; });

  /* ---- phones, WhatsApp, Facebook ---- */
  var main = B.phones[0];
  B.phones.forEach(function (p) { $('strip-phones').appendChild(el('a', { href: tel(p), text: p })); });
  $('hero-call').href = tel(main); $('hero-call').textContent = 'Call ' + main;
  $('callbar-call').href = tel(main); $('callbar-call').textContent = 'Call David';
  document.querySelectorAll('[data-wa]').forEach(function (a) { a.href = waLink(); });
  B.phones.forEach(function (p) {
    var a = el('a', { href: tel(p), html: PHONE_SVG }); a.appendChild(document.createTextNode(p));
    $('contact-list').appendChild(a);
  });
  var wa = el('a', { href: waLink(), html: WA_SVG }); wa.appendChild(document.createTextNode('WhatsApp a photo of the job'));
  $('contact-list').appendChild(wa);
  ['fb-reviews', 'fb-footer'].forEach(function (id) { if (B.facebook) $(id).href = B.facebook; else $(id).hidden = true; });
  $('footer-place').textContent = B.town + ', ' + B.region;
  $('year').textContent = new Date().getFullYear();

  /* ---- hero ---- */
  S.hero.stats.forEach(function (s) {
    $('stats').appendChild(el('div', { 'class': 'stat' }, [el('b', { text: s.value }), el('span', { text: s.label })]));
  });
  S.hero.photos.slice(0, 3).forEach(function (p, i) {
    $('hero-photos').appendChild(photo(p.src, p.alt, 'ph ph-dark' + (i === 0 ? ' big' : '')));
  });

  /* ---- services ---- */
  S.services.items.forEach(function (s) {
    var icon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (ICON[s.icon] || ICON.tools) + '"/></svg>';
    $('services-list').appendChild(el('article', { 'class': 'card' }, [
      el('span', { 'class': 'card-icon', html: icon }), el('h3', { text: s.title }), el('p', { text: s.text })
    ]));
  });

  /* ---- jobs + filters ---- */
  var jobs = S.jobs.items;
  if (!jobs.length) $('work').hidden = true;
  var cats = [];
  jobs.forEach(function (j) {
    if (j.category && cats.indexOf(j.category) < 0) cats.push(j.category);
    var tagB = el('span', { 'class': 'tag', text: 'Before' }), tagA = el('span', { 'class': 'tag after', text: 'After' });
    var b = photo(j.before, j.title + ' – before', 'ph ph-light'); b.prepend(tagB);
    var a = photo(j.after, j.title + ' – after', 'ph ph-light'); a.prepend(tagA);
    var fig = el('figure', { 'class': 'job', 'data-cat': j.category || '' }, [
      el('div', { 'class': 'ba' }, [b, a]),
      el('figcaption', {}, [el('strong', { text: j.title }), el('span', { text: j.town || '' })])
    ]);
    $('job-list').appendChild(fig);
  });
  if (cats.length > 1) {
    ['All'].concat(cats).forEach(function (c, i) {
      var btn = el('button', { type: 'button', 'aria-pressed': String(i === 0), text: c });
      btn.addEventListener('click', function () {
        $('job-filters').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
        $('job-list').querySelectorAll('.job').forEach(function (f) { f.hidden = !(c === 'All' || f.dataset.cat === c); });
      });
      $('job-filters').appendChild(btn);
    });
  }

  /* ---- steps ---- */
  S.steps.forEach(function (s, i) {
    $('steps').appendChild(el('li', {}, [
      el('span', { 'class': 'num', text: String(i + 1).padStart(2, '0') }), el('h3', { text: s.title }), el('p', { text: s.text })
    ]));
  });

  /* ---- reviews ---- */
  $('review-count').textContent = S.reviews.count ? '· ' + S.reviews.count : '';
  S.reviews.items.forEach(function (r) {
    var q = el('blockquote', { 'class': 'review', html: QUOTE_SVG });
    q.appendChild(el('p', { text: r.text }));
    var f = el('footer', {}, [el('strong', { text: r.name })]);
    if (r.job) f.appendChild(document.createTextNode(' · ' + r.job));
    q.appendChild(f);
    $('review-list').appendChild(q);
  });

  /* ---- areas ---- */
  S.areas.towns.forEach(function (t) { $('towns').appendChild(el('li', { text: t })); });

  /* ---- quote form ---- */
  var form = $('quote-form'), msg = $('form-msg');
  form.action = 'https://formspree.io/f/' + S.form.formspreeId;
  $('form-subject').value = S.form.emailSubject;
  S.form.jobTypes.forEach(function (t) { $('job-types').appendChild(el('option', { text: t })); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = 'Sending…';
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(); form.hidden = true; $('thanks').hidden = false; })
      .catch(function () { msg.textContent = 'Sorry, that didn’t send. Please call ' + main + ' or use WhatsApp.'; });
  });
  $('send-wa').addEventListener('click', function () {
    var d = new FormData(form);
    window.open(waLink(
      'Hi, I’d like a free quote.\n' +
      'Name: ' + (d.get('name') || '') + '\n' +
      'Phone: ' + (d.get('phone') || '') + '\n' +
      'Postcode: ' + (d.get('postcode') || '') + '\n' +
      'Job: ' + (d.get('job_type') || '') + '\n' +
      (d.get('message') || '')), '_blank', 'noopener');
  });

  /* ---- Google business info (structured data) ---- */
  var ld = el('script', { type: 'application/ld+json' });
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org', '@type': 'RoofingContractor',
    name: B.name + ' – ' + B.subName,
    telephone: B.phones.map(function (p) { return '+44' + p.replace(/\s+/g, '').replace(/^0/, ''); }),
    address: { '@type': 'PostalAddress', addressLocality: B.town, addressRegion: B.region, addressCountry: 'GB' },
    areaServed: S.areas.towns, url: B.siteUrl, sameAs: B.facebook ? [B.facebook] : undefined
  });
  document.head.appendChild(ld);
})();
</script>
</body>
</html>
